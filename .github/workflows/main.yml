name: Build Expiro Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK (Flutter)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: 🛠️ Scaffold Android Project & Sync
        run: |
          if [ ! -d "android" ]; then
            flutter create . --org com.expiro --project-name expiro
          fi
          flutter pub get

      - name: 🚀 Build APK
        run: |
          flutter build apk --debug

      - name: 📦 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Expiro-Flutter-APK
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: 🏷️ Publish GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0.0
          name: "Expiro Android APK v1.0.0"
          body: "تطبيق Expiro الرسمي لإدارة تواريخ وصلاحيات الأدوية - نسخة أندرويد APK الأصلية (Dart & Flutter)"
          files: build/app/outputs/flutter-apk/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
